name: "Onboarding examples"

# Discovers every Aiken and Node project under examples/onboarding, so new
# examples automatically get tests, type-checks, builds and blueprint checks.

on:
  pull_request:
    paths:
      - "examples/onboarding/**"
      - ".github/workflows/onboarding-examples.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Discover onboarding projects
    runs-on: ubuntu-latest
    outputs:
      on-chain: ${{ steps.discover.outputs.on-chain }}
      off-chain: ${{ steps.discover.outputs.off-chain }}
    steps:
      - uses: actions/checkout@v7

      - name: List projects
        id: discover
        run: |
          on_chain=$(git ls-files 'examples/onboarding/**/aiken.toml' | jq -Rsc '
            split("\n") | map(select(. != "") | ltrimstr("examples/onboarding/") | rtrimstr("/aiken.toml"))')
          off_chain=$(git ls-files 'examples/onboarding/**/package.json' | jq -Rsc '
            split("\n") | map(select(. != "") | ltrimstr("examples/onboarding/") | rtrimstr("/package.json"))')
          echo "on-chain=$on_chain" >> "$GITHUB_OUTPUT"
          echo "off-chain=$off_chain" >> "$GITHUB_OUTPUT"

  on-chain:
    name: ${{ matrix.project }}
    needs: discover
    if: needs.discover.outputs.on-chain != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.on-chain) }}
    defaults:
      run:
        working-directory: examples/onboarding/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the Aiken version
        id: aiken
        run: echo "version=$(sed -n 's/^compiler = "\(.*\)"/\1/p' aiken.toml)" >> "$GITHUB_OUTPUT"

      - uses: aiken-lang/setup-aiken@v1
        with:
          version: ${{ steps.aiken.outputs.version }}

      - name: Compile and test
        run: aiken check

      - name: Check plutus.json is up to date
        run: |
          jq -S '[.validators[] | {title, hash}]' plutus.json > /tmp/committed.json
          aiken build
          jq -S '[.validators[] | {title, hash}]' plutus.json | diff /tmp/committed.json -

      - name: Check the off-chain copy is up to date
        run: |
          shopt -s nullglob
          for copy in ../../off-chain/*/plutus.json ../../off-chain/*/blueprints/*.plutus.json; do
            echo "$copy"
            jq -e --slurpfile fresh plutus.json \
              '[.validators[] | {title, hash}] - [$fresh[0].validators[] | {title, hash}] == []' "$copy"
          done

  off-chain:
    name: ${{ matrix.project }}
    needs: discover
    if: needs.discover.outputs.off-chain != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.off-chain) }}
    defaults:
      run:
        working-directory: examples/onboarding/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Some pretest scripts rebuild the sibling Aiken project.
      - name: Read the Aiken version
        id: aiken
        run: |
          if [ -f ../../on-chain/aiken/aiken.toml ]; then
            echo "version=$(sed -n 's/^compiler = "\(.*\)"/\1/p' ../../on-chain/aiken/aiken.toml)" >> "$GITHUB_OUTPUT"
          fi

      - uses: aiken-lang/setup-aiken@v1
        if: steps.aiken.outputs.version != ''
        with:
          version: ${{ steps.aiken.outputs.version }}

      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run --if-present typecheck
      - run: npm run --if-present build
        env:
          # The advanced oracle validates these at build time; no API calls are made.
          VITE_NETWORK: preprod
          BLOCKFROST_API_KEY: preprod-ci-placeholder
